version: "3.9"

services:
  ros-base-with-rosdep:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    image: ros-base-with-rosdep:latest
    container_name: ros-base-with-rosdep
    network_mode: host
    devices:
      - /dev/video0:/dev/video0
      - /dev/video2:/dev/video2
    restart: unless-stopped
