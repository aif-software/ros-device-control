version: "3.9"

services:
  ros-lidar-flir:
    build:
      dockerfile: Dockerfile.lidar_flir
    image: ros-lidar-flir:latest
    container_name: ros-lidar-flir
    network_mode: host
    devices:
      - /dev/video0:/dev/video0
      - /dev/video2:/dev/video2
    volumes:
      - /mnt/Burak2/ros-device-control/bags:/app/bags
    restart: unless-stopped
